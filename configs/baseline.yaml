project:
  name: widowxai-quest-teleop
  mode: simulation

model:
  xml_path: third_party/trossen_arm_mujoco/trossen_arm_mujoco/assets/wxai/wxai_follower.xml
  simulation_scene_xml_path: third_party/trossen_arm_mujoco/trossen_arm_mujoco/assets/wxai/scene_wxai_follow_target.xml
  end_effector_site: ee_site
  wrist_anchor_site: wrist_anchor
  # Official Trossen staged posture, used only as the simulation/rest bias.
  simulation_start_q_rad: [0.0, 1.0471975512, 0.5235987756, 0.6283185307, 0.0, 0.0]

quest:
  hand: left
  websocket_url: ws://127.0.0.1:8443/ws
  stale_timeout_s: 0.100
  fresh_samples_to_recover: 3
  calibration: configs/calibrations/left_behind_full_pose_good_20260602.json
  translation_scale: 1.0
  rotation_scale: 1.0
  position_reach_limit_m: 0.10
  rotation_reach_limit_rad: 0.45

control:
  ik_rate_hz: 50
  command_rate_hz: 100
  command_goal_time_s: 0.030
  joint_target_lowpass_hz: 8.0
  xr_pose_filter: none
  prediction_lead_time_s: 0.0
  feedforward_source: none
  position_task: hard
  orientation_task_weight: 0.005
  max_ee_velocity_m_s: 0.25
  max_ee_acceleration_m_s2: 1.0
  max_joint_velocity_rad_s: [1.0, 1.0, 1.0, 1.5, 1.5, 1.5]
  max_joint_acceleration_rad_s2: [4.0, 4.0, 4.0, 8.0, 8.0, 8.0]
  max_joint_jerk_rad_s3: [240.0, 240.0, 240.0, 360.0, 360.0, 360.0]
  max_joint_step_rad: [0.005, 0.005, 0.005, 0.010, 0.010, 0.010]

ik:
  backend: decoupled
  iterations_per_tick: 2
  lambda_position: 0.05
  lambda_position_extra: 0.15
  position_manipulability_threshold: 0.05
  rest_bias: 0.02
  lambda_rotation: 0.05
  lambda_rotation_extra: 0.40
  rotation_manipulability_threshold: 0.50
  orientation_hold_error_rad: 2.20
  max_position_error_step_m: 0.025
  max_rotation_error_step_rad: 0.12

hardware:
  enabled: false
  robot_ip: 192.168.1.2
  require_explicit_enable: true

telemetry:
  output_dir: runs
  format: csv
