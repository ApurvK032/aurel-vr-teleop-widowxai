project:
  name: widowxai-quest-teleop
  mode: hardware_demo

model:
  xml_path: third_party/trossen_arm_mujoco/trossen_arm_mujoco/assets/wxai/wxai_follower.xml
  end_effector_site: ee_site
  wrist_anchor_site: wrist_anchor
  # Official Trossen WidowXAI staged posture used by the startup ramp.
  simulation_start_q_rad: [0.0, 1.0471975512, 0.5235987756, 0.6283185307, 0.0, 0.0]

quest:
  hand: left
  websocket_url: ws://127.0.0.1:8443/ws
  stale_timeout_s: 0.100
  fresh_samples_to_recover: 3
  calibration: configs/calibrations/left_behind_full_pose_good_20260602.json
  # 50% of the article defaults (1.5 x 0.5), applied immediately in pose space.
  translation_scale: 0.75
  rotation_scale: 0.75
  position_reach_limit_m: 0.25
  rotation_reach_limit_rad: 0.60

control:
  loop_rate_hz: 200
  pose_filter_alpha: 0.8

ik:
  backend: decoupled
  lambda_position: 0.05
  lambda_position_extra: 0.15
  position_manipulability_threshold: 0.05
  rest_bias: 0.02
  lambda_rotation: 0.05
  lambda_rotation_extra: 0.40
  rotation_manipulability_threshold: 0.50
  orientation_hold_error_rad: 2.20
  # About 50% of the official WidowXAI velocity limits at 200 Hz.
  max_dq_per_joint_rad: [0.015, 0.015, 0.015, 0.023, 0.023, 0.023]

hardware:
  enabled: true
  robot_ip: null
  require_explicit_enable: true
  driver_package: trossen-arm
  driver_version_tested: 1.11.0
  startup_ramp_duration_s: 5.0
  startup_ramp_rate_hz: 50
  max_demo_duration_s: 120.0
  joint_limit_margin_rad: 0.05
  max_feedback_error_rad: 0.25
  feedback_check_rate_hz: 20
  gripper_open_m: 0.044
  gripper_min_demo_m: 0.022
  max_gripper_delta_m: 0.001

telemetry:
  output_dir: runs
  format: csv
